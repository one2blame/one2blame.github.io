<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H3X N0V4 Exploit Framework</title>
    <!-- New Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --background-dark: #0d1117;
        --container-bg: rgba(22, 27, 34, 0.85);
        --border-color: rgba(56, 139, 253, 0.4);
        --accent-cyan: #39c5fe;
        --accent-magenta: #f72585;
        --text-primary: #c9d1d9;
        --text-secondary: #8b949e;
        --glow-cyan: rgba(57, 197, 254, 0.5);
        --accent-green: #3fb950;
      }

      body {
        color: var(--text-primary);
        font-family: "Roboto Mono", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        overflow: hidden;

        /* --- NEW BACKGROUND --- */
        background-color: var(--background-dark);
        background-image:
          linear-gradient(var(--accent-cyan, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, var(--accent-cyan, 0.1) 1px, transparent 1px);
        background-size: 35px 35px;
        background-position: -1px -1px;
      }

      .dashboard-container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 950px;
        height: 90vh;
        max-height: 750px;
        background-color: var(--container-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        box-shadow:
          0 0 40px rgba(0, 0, 0, 0.5),
          inset 0 0 10px rgba(57, 197, 254, 0.1);
        padding: 25px;
        display: flex;
        flex-direction: column;
        animation: fadeIn 1s ease-in-out;
        backdrop-filter: blur(10px);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      header h1 {
        font-family: "Orbitron", sans-serif;
        color: var(--accent-cyan);
        font-size: 2.2em;
        margin: 0 0 20px 0;
        letter-spacing: 3px;
        text-transform: uppercase;
        text-align: center;
        text-shadow:
          0 0 8px var(--glow-cyan),
          0 0 15px var(--glow-cyan);
        animation: text-pop-in 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes text-pop-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .main-content {
        display: flex;
        flex-grow: 1;
        gap: 20px;
        overflow: hidden;
      }

      .exploit-panel {
        flex: 1;
        background-color: rgba(13, 17, 23, 0.5);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        overflow-y: auto;
      }

      .exploit-panel h2 {
        margin-top: 0;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
        font-size: 1.5em;
        color: var(--text-primary);
      }

      .exploit-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .exploit-item {
        padding: 12px 15px;
        margin-bottom: 10px;
        background-color: rgba(33, 38, 45, 0.7);
        border: 1px solid #30363d;
        border-left: 4px solid var(--text-secondary);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .exploit-item:hover {
        background-color: rgba(56, 139, 253, 0.1);
        border-left-color: var(--accent-cyan);
        transform: translateX(5px);
      }

      .exploit-item .icon {
        font-size: 1.5em;
        width: 30px;
        text-align: center;
        color: var(--accent-cyan);
      }

      .exploit-item.running .icon {
        color: orange;
        animation: spin 1.5s linear infinite;
      }
      .exploit-item.success .icon {
        color: var(--accent-green);
      }
      .exploit-item.failed .icon {
        color: var(--accent-magenta);
      }

      .exploit-item.running {
        border-left-color: orange;
        pointer-events: none;
      }
      .exploit-item.success {
        border-left-color: var(--accent-green);
      }
      .exploit-item.failed {
        border-left-color: var(--accent-magenta);
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .exploit-details {
        flex-grow: 1;
      }
      .exploit-name {
        font-size: 1.1em;
        font-weight: bold;
      }
      .exploit-status {
        font-size: 0.9em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      .log-panel {
        flex: 2.5;
        background-color: #010409;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 15px;
        font-size: 1.1em;
        overflow-y: auto;
        white-space: pre-wrap;
        font-family: "Roboto Mono", monospace;
      }

      .log-line {
        display: block;
        margin-bottom: 5px;
      }
      .log-line .timestamp {
        color: #58a6ff;
        margin-right: 10px;
      }
      .log-line .info {
        color: var(--accent-cyan);
      }
      .log-line .success {
        color: #3fb950;
      }
      .log-line .warning {
        color: #d29922;
      }
      .log-line .error {
        color: #f85149;
      }

      .log-controls {
        text-align: right;
        margin-top: 15px;
      }
      .log-controls button {
        background-color: #21262d;
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        padding: 8px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-family: "Roboto Mono", monospace;
        font-size: 0.9em;
        transition: background-color 0.2s;
      }
      .log-controls button:hover {
        background-color: #30363d;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <header>
        <h1>H3X N0V4 Exploit Framework</h1>
      </header>

      <main class="main-content">
        <div class="exploit-panel">
          <h2>Exploit Modules</h2>
          <ul class="exploit-list" id="exploit-list">
            <!-- Exploits will be generated by JavaScript -->
          </ul>
        </div>
        <div class="log-panel" id="log-output">
          <span class="log-line"
            ><span class="timestamp">[--:--:--]</span
            ><span class="info"
              >Log Console Initialized. Awaiting command...</span
            ></span
          >
        </div>
      </main>
      <div class="log-controls">
        <button id="clear-log-btn">Clear Log</button>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const exploitListEl = document.getElementById("exploit-list")
        const logOutputEl = document.getElementById("log-output")
        const clearLogBtn = document.getElementById("clear-log-btn")

        // --- Exploit Definitions ---
        const exploits = {
          log4shell: {
            name: "Log4Shell RCE (CVE-2021-44228)",
            icon: "fa-solid fa-code",
            logs: [
              {
                text: "Targeting vulnerable Log4j instance on 10.126.2.100...",
                class: "info",
              },
              {
                text: "Injecting malicious JNDI lookup string: ${jndi:ldap://...}",
                class: "warning",
              },
              { text: "Received callback from target server.", class: "info" },
              {
                text: "Downloading and executing payload 'payload.jar'...",
                class: "",
              },
              {
                text: "SUCCESS: Reverse shell established. Gained full system access.",
                class: "success",
                status: "success",
              },
            ],
          },
          citrix_bleed: {
            name: "Citrix Bleed (CVE-2023-4966)",
            icon: "fa-solid fa-cookie-bite",
            logs: [
              {
                text: "Scanning target 10.126.2.25 for Citrix Bleed vulnerability...",
                class: "info",
              },
              {
                text: "Target is vulnerable. Beginning memory leak phase...",
                class: "warning",
              },
              {
                text: "Leaking session tokens from NetScaler memory buffer...",
                class: "",
              },
              { text: "Found 4 active session tokens.", class: "info" },
              {
                text: "SUCCESS: Replayed admin session token. Full access to gateway granted.",
                class: "success",
                status: "success",
              },
            ],
          },
          moveit_sqli: {
            name: "MOVEit SQLi (CVE-2023-34362)",
            icon: "fa-solid fa-database",
            logs: [
              {
                text: "Targeting MOVEit Transfer server on 10.126.3.50...",
                class: "info",
              },
              {
                text: "Crafting SQL injection payload for authentication bypass...",
                class: "",
              },
              {
                text: "Authentication bypassed. Dumping user tables...",
                class: "warning",
              },
              { text: "Exfiltrating sensitive data folders...", class: "" },
              {
                text: "ERROR: Data transfer interrupted by network firewall.",
                class: "error",
                status: "failed",
              },
            ],
          },
          kernel_pwn: {
            name: "Kernel PWN (Xorfidential)",
            icon: "fa-solid fa-bug",
            logs: [
              {
                text: "Targeting H3X N0V4 Secure Kernel Interface...",
                class: "info",
              },
              {
                text: "Sending trigger byte 'A' to access vulnerable function...",
                class: "",
              },
              {
                text: "Calculating custom canary value: 0xBADBEEF0...",
                class: "warning",
              },
              {
                text: "SUCCESS: Leaked encrypted datastream. Begin post-exploitation.",
                class: "success",
                status: "success",
              },
            ],
          },
          pikabot_rat: {
            name: "Custom Encryptor (3CX)",
            icon: "fa-solid fa-person-military-pointing",
            logs: [
              { text: "Performing encryption on the flag...", class: "info" },
              {
                text: "Using Key from 3CX Attack: '3cx_attack_capture.pcap'.",
                class: "warning",
              },
              { text: "Printing the encrypted flag...", class: "" },
              {
                text: "Establishing C2 connection to https://overflow-dc33.s3.us-west-2.amazonaws.com/ransom.html...",
                class: "",
              },
              {
                text: "SUCCESS: Flag Encrypted. Files Compromised.",
                class: "success",
                status: "success",
              },
            ],
          },
        }

        let isRunning = false

        function writeToLog(text, className = "") {
          const now = new Date()
          const timestamp = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`
          const timeEl = `<span class="timestamp">[${timestamp}]</span>`
          const textEl = `<span class="${className}">${text}</span>`
          logOutputEl.innerHTML += `<div class="log-line">${timeEl} ${textEl}</div>`
          logOutputEl.scrollTop = logOutputEl.scrollHeight
        }

        function runExploit(exploitId, exploitItemEl) {
          if (isRunning) {
            writeToLog("An exploit is already in progress.", "warning")
            return
          }

          isRunning = true
          exploitItemEl.classList.remove("success", "failed")
          exploitItemEl.classList.add("running")
          exploitItemEl.querySelector(".exploit-status").textContent =
            "Running..."

          const exploit = exploits[exploitId]
          writeToLog(`Executing module: ${exploit.name}`, "info")

          let logIndex = 0
          const runLog = () => {
            if (logIndex < exploit.logs.length) {
              const logEntry = exploit.logs[logIndex]
              writeToLog(logEntry.text, logEntry.class)

              if (logEntry.status) {
                exploitItemEl.classList.remove("running")
                exploitItemEl.classList.add(logEntry.status)
                exploitItemEl.querySelector(".exploit-status").textContent =
                  logEntry.status
                isRunning = false
              }

              logIndex++
              setTimeout(runLog, Math.random() * 1000 + 500)
            }
          }
          runLog()
        }

        function initializeDashboard() {
          exploitListEl.innerHTML = ""
          for (const id in exploits) {
            const li = document.createElement("li")
            li.className = "exploit-item"
            li.dataset.exploitId = id
            li.innerHTML = `
                        <i class="icon ${exploits[id].icon}"></i>
                        <div class="exploit-details">
                            <span class="exploit-name">${exploits[id].name}</span>
                            <span class="exploit-status">Ready</span>
                        </div>
                    `
            li.addEventListener("click", () => runExploit(id, li))
            exploitListEl.appendChild(li)
          }
        }

        clearLogBtn.addEventListener("click", () => {
          logOutputEl.innerHTML = `<span class="log-line"><span class="timestamp">[--:--:--]</span><span class="info">Log Console Cleared.</span></span>`
        })

        initializeDashboard()
      })
    </script>
  </body>
</html>
