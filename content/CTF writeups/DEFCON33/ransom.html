<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYSTEM COMPROMISED</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@700&display=swap");

      :root {
        --ransom-red: #ff073a;
        --glow-red: rgba(255, 7, 58, 0.7);
        --off-white: #f5f5f5;
        --background-dark: #0a0a0a;
        --container-dark: #121212;
      }

      body {
        background-color: var(--background-dark);
        color: var(--off-white);
        font-family: "VT323", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        overflow: hidden;
        text-shadow: 0 0 3px var(--glow-red);
      }

      .container {
        width: 100%;
        max-width: 700px;
        background-color: var(--container-dark);
        border: 2px solid var(--ransom-red);
        border-radius: 10px;
        box-shadow:
          0 0 25px var(--glow-red),
          inset 0 0 15px rgba(255, 7, 58, 0.2);
        padding: 20px 30px;
        text-align: center;
        animation: fadeIn 1s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      header h1 {
        font-family: "Orbitron", sans-serif;
        color: var(--ransom-red);
        font-size: 2.5em;
        margin: 0 0 10px 0;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: flicker 1.5s infinite alternate;
      }

      @keyframes flicker {
        0%,
        18%,
        22%,
        25%,
        53%,
        57%,
        100% {
          text-shadow:
            0 0 4px var(--ransom-red),
            0 0 11px var(--ransom-red),
            0 0 19px var(--ransom-red),
            0 0 40px var(--glow-red),
            0 0 80px var(--glow-red);
          opacity: 1;
        }
        20%,
        24%,
        55% {
          text-shadow: none;
          opacity: 0.8;
        }
      }

      #timer {
        font-size: 4em;
        font-family: "Orbitron", sans-serif;
        margin: 15px 0;
        color: var(--ransom-red);
      }

      .payment-info {
        margin: 25px 0;
        border-top: 1px dashed rgba(255, 7, 58, 0.4);
        border-bottom: 1px dashed rgba(255, 7, 58, 0.4);
        padding: 20px 0;
      }

      .payment-info p {
        margin: 5px 0;
        font-size: 1.2em;
      }

      .payment-info strong {
        color: #ffff00; /* Yellow highlight for amount */
      }

      .wallet-address {
        background-color: #0a0a0a;
        border: 1px solid #444;
        padding: 10px;
        border-radius: 5px;
        font-size: 1.1em;
        word-wrap: break-word;
        margin: 15px auto;
        max-width: 90%;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .wallet-address:hover {
        background-color: #333;
      }

      #copy-feedback {
        color: #00ff00;
        height: 1.2em;
        font-size: 0.9em;
      }

      #status-box {
        margin-top: 20px;
        font-size: 1.3em;
      }

      #status-text {
        color: orange;
        text-transform: uppercase;
        font-weight: bold;
      }

      #decrypt-button {
        background-color: #555;
        color: #999;
        padding: 12px 25px;
        border: 2px solid #555;
        border-radius: 5px;
        cursor: not-allowed;
        font-size: 1.3em;
        font-family: "Orbitron", sans-serif;
        text-transform: uppercase;
        margin-top: 20px;
        transition: all 0.3s;
      }

      #decrypt-button.enabled {
        background-color: #00ff00;
        color: #0d0d0d;
        border-color: #00ff00;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
      }
      #decrypt-button.enabled:hover {
        background-color: #33ff33;
        box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
      }

      #decryption-progress {
        display: none;
        width: 100%;
        background-color: #333;
        border: 1px solid var(--ransom-red);
        border-radius: 5px;
        margin-top: 20px;
        overflow: hidden;
      }
      #progress-bar {
        width: 0%;
        height: 25px;
        background-color: #00ff00;
        text-align: center;
        line-height: 25px;
        color: #0d0d0d;
        font-weight: bold;
        transition: width 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>SYSTEM COMPROMISED</h1>
        <p>Your files have been encrypted by the Shadow Net Collective.</p>
      </header>

      <section id="countdown">
        <h2>Time Remaining to Avoid Data Deletion:</h2>
        <div id="timer">00:01:30</div>
      </section>

      <section class="payment-info">
        <p>Payment Required: <strong>0.0 BTC</strong></p>
        <p>Send payment to the following address:</p>
        <div id="wallet-address" class="wallet-address" title="Click to copy">
          bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
        </div>
        <div id="copy-feedback"></div>
      </section>

      <section id="status-box">
        <p>Payment Status: <span id="status-text">Awaiting Payment...</span></p>
      </section>

      <footer>
        <button id="decrypt-button" disabled>Decrypt Files</button>
        <div id="decryption-progress">
          <div id="progress-bar">0%</div>
        </div>
      </footer>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const timerEl = document.getElementById("timer")
        const walletAddressEl = document.getElementById("wallet-address")
        const copyFeedbackEl = document.getElementById("copy-feedback")
        const statusTextEl = document.getElementById("status-text")
        const decryptButton = document.getElementById("decrypt-button")
        const decryptionProgress = document.getElementById(
          "decryption-progress",
        )
        const progressBar = document.getElementById("progress-bar")

        let timeRemaining = 15 // 90 minutes in seconds

        // --- Countdown Timer ---
        const countdownInterval = setInterval(() => {
          timeRemaining--

          if (timeRemaining <= 0) {
            clearInterval(countdownInterval)
            timerEl.textContent = "FILES DELETED"
            document.querySelector(".container").style.borderColor = "#888"
            return
          }

          const hours = Math.floor(timeRemaining / 3600)
          const minutes = Math.floor((timeRemaining % 3600) / 60)
          const seconds = timeRemaining % 60

          timerEl.textContent = `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`
        }, 1000)

        // --- Clipboard ---
        walletAddressEl.addEventListener("click", () => {
          const address = walletAddressEl.textContent.trim()
          navigator.clipboard.writeText(address).then(
            () => {
              copyFeedbackEl.textContent = "Address copied to clipboard!"
              setTimeout(() => {
                copyFeedbackEl.textContent = ""
              }, 2000)
            },
            () => {
              copyFeedbackEl.textContent = "Failed to copy."
            },
          )
        })

        // --- Simulate Payment ---
        // This is a fake check that "finds" a payment after a delay.
        setTimeout(() => {
          statusTextEl.textContent = "PAYMENT PENDING CONFIRMATION (1/6)"
          statusTextEl.style.color = "#ffff00"
        }, 30000) // 30 seconds

        setTimeout(() => {
          statusTextEl.textContent = "PAYMENT RECEIVED"
          statusTextEl.style.color = "#00ff00"
          decryptButton.disabled = false
          decryptButton.classList.add("enabled")
        }, 60000) // 1 minute

        // --- Decryption Logic ---
        decryptButton.addEventListener("click", () => {
          if (!decryptButton.classList.contains("enabled")) return

          decryptButton.style.display = "none"
          decryptionProgress.style.display = "block"

          let progress = 0
          const progressInterval = setInterval(() => {
            progress += Math.floor(Math.random() * 10) + 1
            if (progress > 100) {
              progress = 100
            }
            progressBar.style.width = `${progress}%`
            progressBar.textContent = `${progress}%`

            if (progress === 100) {
              clearInterval(progressInterval)
              setTimeout(() => {
                document.querySelector(".container").innerHTML = `
                                <h1 style="color: #00ff00; font-family: 'Orbitron', sans-serif;">DECRYPTION COMPLETE</h1>
                                <p>All files have been restored.</p>
                                <p>Your system is now clean.</p>
                                <p>Access the page /index.html.</p>
                           `
              }, 1000)
            }
          }, 300)
        })
      })
    </script>
  </body>
</html>
